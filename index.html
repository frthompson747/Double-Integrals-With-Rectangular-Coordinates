<style>
  :root{
    --bg:#0c1019; --panel:#141b29; --panel2:#1b2435; --line:#26314a;
    --txt:#e8edf6; --muted:#8a97ad; --accent:#3ad07a; --live:#ff5252;
    --chip:#223049; --gold:#ffcc4d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0c1019,#0c1019f0);
         border-bottom:1px solid var(--line);padding:14px 16px;backdrop-filter:blur(6px)}
  .h-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
  h1 small{color:var(--muted);font-weight:500;font-size:12px;display:block}
  .grow{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
         border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600}
  button:hover{border-color:#3a4a6b}
  button.primary{background:var(--accent);color:#06120a;border-color:transparent}
  button.primary:disabled{opacity:.6;cursor:wait}
  .status{font-size:12px;color:var(--muted)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .filters button{padding:6px 10px;border-radius:999px;font-size:12px}
  .filters button.on{background:var(--chip);border-color:#3a4a6b;color:#fff}
  main{max-width:920px;margin:0 auto;padding:14px 12px 60px}
  .daygroup{margin-top:18px}
  .dayhdr{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;
          margin:0 4px 8px;font-weight:700}
  .match{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;
         background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:10px 12px;margin-bottom:8px}
  .match.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
  .time{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
  .stagechip{display:inline-block;font-size:10px;color:var(--gold);margin-top:3px}
  .teams{min-width:0}
  .tline{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:1px 0}
  .tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .tname.win{color:#fff}
  .tname.tbd{color:var(--muted);font-style:italic;font-weight:500}
  .sc{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;min-width:22px;text-align:right}
  .venue{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .b-live{background:var(--live);color:#fff}
  .b-final{background:#2a3650;color:#c8d2e6}
  .b-sched{background:#202a3e;color:var(--muted)}
  .b-manual{background:#3a2d12;color:var(--gold)}
  .edit{font-size:11px;color:var(--muted);border:none;background:none;padding:2px 4px;text-decoration:underline}
  .editor input{width:34px;background:var(--panel2);border:1px solid var(--line);color:#fff;
                 border-radius:6px;padding:3px;text-align:center;font-size:14px}
  .editor{display:flex;align-items:center;gap:4px}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .note{font-size:11px;color:var(--muted);margin-top:6px}
  a{color:var(--accent)}
</style>
</head>

</header>

// ---- team name canonicalization for matching ESPN -> our schedule ----
function canon(name){
  if(!name) return "";
  let s = name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/[^a-z0-9]/g,"");
  const alias = {
    turkey:"turkiye", trkiye:"turkiye",
    czechrepublic:"czechia",
    cotedivoire:"ivorycoast", ivorycoast:"ivorycoast",
    drcongo:"congodr", democraticrepublicofthecongo:"congodr", congodr:"congodr", congodemocraticrepublic:"congodr",
    korearepublic:"southkorea", southkorea:"southkorea",
    usa:"unitedstates", unitedstatesofamerica:"unitedstates", us:"unitedstates",
    caboverde:"capeverde", capeverde:"capeverde",
    bosniaherzegovina:"bosniaandherzegovina",
    irislamicrepublic:"iran", iranislamicrepublic:"iran",
    curacao:"curacao",
  };
  return alias[s] || s;
}
function pairKey(a,b){ return [canon(a),canon(b)].sort().join("__"); }

// schedule lookup by team pair (group stage only -> teams known)
const pairToId = {};
MATCHES.forEach(m=>{ if(m.home && m.away) pairToId[pairKey(m.home,m.away)] = m.id; });

// ---- date helpers ----
function ymd(iso){ return iso.replace(/-/g,""); } // 2026-06-14 -> 20260614
function todayLocalYMD(){
  const d=new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
const ALL_DATES = [...new Set(MATCHES.map(m=>ymd(m.date)))].sort();

// ---- ESPN fetch + merge ----
async function fetchScoreboard(dateYMD){
  const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${LEAGUE}/scoreboard?dates=${dateYMD}`;
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
function ingest(data){
  let n=0;
  (data.events||[]).forEach(ev=>{
    const comp = (ev.competitions||[])[0]; if(!comp) return;
    const cs = comp.competitors||[]; if(cs.length<2) return;
    const A=cs[0], B=cs[1];
    const nameA=(A.team&&(A.team.displayName||A.team.name))||A.displayName;
    const nameB=(B.team&&(B.team.displayName||B.team.name))||B.displayName;
    const id = pairToId[pairKey(nameA,nameB)];
    if(!id) return; // can't map (e.g. knockout TBD) -> skip
    const m = MATCHES.find(x=>x.id===id);
    // align ESPN scores to our home/away ordering
    const map={}; map[canon(nameA)]=A.score; map[canon(nameB)]=B.score;
    const sh=map[canon(m.home)], sa=map[canon(m.away)];
    const st=(ev.status&&ev.status.type)||{};
    const state = st.state||"pre"; // pre | in | post
    const prev = store[id];
    if(prev && prev.src==="manual") return; // never overwrite a manual entry
    store[id] = {
      h: sh===undefined?null:Number(sh),
      a: sa===undefined?null:Number(sa),
      status: state==="in"?"live":(state==="post"?"final":"sched"),
      det: st.shortDetail||st.detail||"",
      src: "api"
    };
    n++;
  });
  return n;
}

async function refresh(dates){
  const btn=document.getElementById("refresh"), sync=document.getElementById("syncall");
  btn.disabled=true; sync.disabled=true;
  setStatus("Fetching latest scores…");
  let updated=0, errors=0;
  await Promise.all(dates.map(d=>
    fetchScoreboard(d).then(j=>{ updated+=ingest(j); }).catch(()=>{ errors++; })
  ));
  save(); render();
  const t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  if(errors && updated===0){
    setStatus(`Couldn’t reach the live feed (${errors} request(s) failed). Showing saved/edited scores. You can still tap Edit to enter scores. Last try ${t}.`);
  }else{
    setStatus(`Updated ${updated} match score(s) at ${t}.` + (errors?` (${errors} date(s) failed)`:""));
  }
  btn.disabled=false; sync.disabled=false;
}
function recentDates(){
  // today + previous 2 days that exist in the schedule
  const today=todayLocalYMD();
  const past = ALL_DATES.filter(d=>d<=today);
  const set=new Set(past.slice(-3));
  set.add(today);
  return [...set].filter(d=>ALL_DATES.includes(d));
}

// ---- rendering ----
let activeFilter = localStorage.getItem(LS_FILTER) || "Today";
const STAGES=["Group Stage","Round of 32","Round of 16","Quarterfinals","Semifinals","Third-Place Match","Final"];
const FILTERS=["Today","Live","All",...STAGES];

function setStatus(t){ document.getElementById("updated").innerHTML=t; }

function dayLabel(iso){
  const [y,mo,da]=iso.split("-").map(Number);
  const dt=new Date(y,mo-1,da);
  return dt.toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"});
}
function isToday(iso){ return ymd(iso)===todayLocalYMD(); }

function matchRow(m){
  const sc = store[m.id] || {};
  const live = sc.status==="live";
  const hasScore = sc.h!=null && sc.a!=null;
  const homeWin = hasScore && sc.h>sc.a, awayWin = hasScore && sc.a>sc.h;
  const tbd = !(m.home&&m.away);
  const homeName = m.home || "TBD";
  const awayName = m.away || "TBD";

  let badge="";
  if(sc.src==="manual") badge=`<span class="badge b-manual">edited</span>`;
  else if(live) badge=`<span class="badge b-live">● LIVE${sc.det?(" "+sc.det):""}</span>`;
  else if(sc.status==="final") badge=`<span class="badge b-final">FT</span>`;
  else badge=`<span class="badge b-sched">${m.time}</span>`;

  const scH = hasScore? sc.h : "–";
  const scA = hasScore? sc.a : "–";

  return `<div class="match ${live?"live":""}" data-id="${m.id}">
    <div class="time">${m.time}<div class="stagechip">${m.stage==="Group Stage"?"":m.stage}</div></div>
    <div class="teams">
      <div class="tline"><span class="tname ${homeWin?"win":""} ${tbd?"tbd":""}">${homeName}</span><span class="sc">${scH}</span></div>
      <div class="tline"><span class="tname ${awayWin?"win":""} ${tbd?"tbd":""}">${awayName}</span><span class="sc">${scA}</span></div>
      <div class="venue">${m.venue}</div>
    </div>
    <div class="meta">
      ${badge}
      <button class="edit" data-edit="${m.id}">Edit</button>
    </div>
  </div>`;
}

function render(){
  // filter buttons
  const fc=document.getElementById("filters");
  fc.innerHTML=FILTERS.map(f=>`<button class="${f===activeFilter?"on":""}" data-f="${f}">${f}</button>`).join("");

  let list = MATCHES.slice();
  if(activeFilter==="Today") list=list.filter(m=>isToday(m.date));
  else if(activeFilter==="Live") list=list.filter(m=>(store[m.id]||{}).status==="live");
  else if(STAGES.includes(activeFilter)) list=list.filter(m=>m.stage===activeFilter);

  const host=document.getElementById("list");
  if(!list.length){
    let msg = activeFilter==="Today" ? "No matches scheduled for today." :
              activeFilter==="Live" ? "No matches are live right now." : "No matches.";
    host.innerHTML=`<div class="empty">${msg}</div>`;
    return;
  }
  // group by date
  const byDate={};
  list.forEach(m=>{ (byDate[m.date]=byDate[m.date]||[]).push(m); });
  host.innerHTML=Object.keys(byDate).sort().map(d=>
    `<div class="daygroup"><div class="dayhdr">${dayLabel(d)}${isToday(d)?" · Today":""}</div>${byDate[d].map(matchRow).join("")}</div>`
  ).join("");
}

// ---- editing a score by hand ----
function openEditor(id){
  const m=MATCHES.find(x=>x.id===id); if(!m) return;
  const sc=store[id]||{};
  const row=document.querySelector(`.match[data-id="${id}"] .meta`);
  if(!row) return;
  row.innerHTML=`<div class="editor">
      <input id="eh" type="number" min="0" value="${sc.h!=null?sc.h:""}">
      <span>:</span>
      <input id="ea" type="number" min="0" value="${sc.a!=null?sc.a:""}">
    </div>
    <div><button data-save="${id}" class="edit">Save</button>
    <button data-clear="${id}" class="edit">Clear</button></div>`;
}

document.addEventListener("click",(e)=>{
  const f=e.target.closest("[data-f]");
  if(f){ activeFilter=f.dataset.f; localStorage.setItem(LS_FILTER,activeFilter); render(); return; }
  const ed=e.target.closest("[data-edit]");
  if(ed){ openEditor(Number(ed.dataset.edit)); return; }
  const sv=e.target.closest("[data-save]");
  if(sv){
    const id=Number(sv.dataset.save);
    const h=document.getElementById("eh").value, a=document.getElementById("ea").value;
    store[id]={ h:h===""?null:Number(h), a:a===""?null:Number(a),
                status:(h!==""&&a!=="")?"final":"sched", det:"", src:"manual" };
    save(); render(); return;
  }
  const cl=e.target.closest("[data-clear]");
  if(cl){ delete store[Number(cl.dataset.clear)]; save(); render(); return; }
});

document.getElementById("refresh").addEventListener("click",()=>refresh(recentDates()));
document.getElementById("syncall").addEventListener("click",()=>{
  const today=todayLocalYMD();
  refresh(ALL_DATES.filter(d=>d<=today));
});

let timer=null;
document.getElementById("auto").addEventListener("change",(e)=>{
  if(e.target.checked){ timer=setInterval(()=>refresh(recentDates()),60000); refresh(recentDates()); }
  else if(timer){ clearInterval(timer); timer=null; }
});

render();
</script>
</body>
</html>
