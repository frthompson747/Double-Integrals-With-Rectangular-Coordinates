<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>World Cup 2026 — My Tracker</title>
<style>
  :root{
    --bg:#070a12; --txt:#eef2fa; --muted:#7c889e;
    --accent:#19e08a; --accent2:#7c5cff; --gold:#ffd24a; --live:#ff3b5c;
    --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4;
       padding-bottom:env(safe-area-inset-bottom)}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
     radial-gradient(60% 50% at 12% -5%,rgba(124,92,255,.22),transparent 60%),
     radial-gradient(55% 45% at 105% 8%,rgba(25,224,138,.16),transparent 60%),
     radial-gradient(70% 60% at 50% 110%,rgba(255,210,74,.08),transparent 60%)}
  body::after{content:"";position:fixed;inset:-50%;z-index:-3;pointer-events:none;opacity:.04;
     background:radial-gradient(circle at 20% 30%,#fff 0,transparent 1px) 0 0/26px 26px}

  header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
         background:rgba(7,10,18,.72);backdrop-filter:blur(16px) saturate(140%);
         -webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{font-size:28px;line-height:1;filter:drop-shadow(0 3px 8px rgba(255,210,74,.45));cursor:pointer;
         transition:transform .2s}
  .logo:active{transform:scale(.9)}
  .logo.spin{animation:spin .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes spin{to{transform:rotate(360deg) scale(1.15)}}
  h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.3px;
     background:linear-gradient(90deg,#19e08a,#7c5cff 75%);-webkit-background-clip:text;
     background-clip:text;color:transparent}
  .sub{font-size:11px;color:var(--muted);margin-top:1px;font-weight:600;letter-spacing:.3px}
  .grow{flex:1}
  .toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}

  .controls{display:flex;align-items:center;gap:9px;margin-top:13px;flex-wrap:wrap}
  button{cursor:pointer;font:inherit;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:800;
         color:var(--txt);background:var(--card);border:1px solid var(--line);transition:.15s}
  button:active{transform:scale(.96)}
  button.primary{background:linear-gradient(135deg,#19e08a,#0bbf93);color:#04130c;border-color:transparent;
                 box-shadow:0 8px 22px rgba(25,224,138,.32)}
  button.primary:disabled{opacity:.55}

  .filters{display:flex;gap:8px;margin-top:13px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{white-space:nowrap;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
                  color:#aeb8c9;flex:0 0 auto}
  .filters button.on{background:linear-gradient(135deg,#19e08a,#0bbf93);color:#04130c;border-color:transparent;
                     box-shadow:0 5px 16px rgba(25,224,138,.35)}
  .status{font-size:11px;color:var(--muted);margin-top:11px;line-height:1.5}

  main{max-width:760px;margin:0 auto;padding:8px 12px 70px}
  .dayhdr{display:flex;align-items:center;gap:11px;margin:24px 4px 13px;font-size:12px;font-weight:900;
          letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .dayhdr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .pill-today{color:#04130c;background:linear-gradient(135deg,#19e08a,#0bbf93);padding:2px 9px;
              border-radius:999px;font-size:10px;letter-spacing:.5px}

  .card{position:relative;display:grid;grid-template-columns:54px 1fr auto;
        grid-template-areas:"kick teams meta" "venue venue venue";gap:2px 14px;
        padding:14px;border-radius:18px;margin-bottom:12px;overflow:hidden;
        background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
        border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.38);
        backdrop-filter:blur(8px);transition:transform .16s,box-shadow .16s,border-color .16s}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18);box-shadow:0 16px 34px rgba(0,0,0,.5)}
  .card.live{border-color:rgba(255,59,92,.55);
             box-shadow:0 0 0 1px rgba(255,59,92,.4),0 12px 32px rgba(255,59,92,.2)}
  .card.goal{animation:goalflash 1.1s ease-out}
  @keyframes goalflash{0%{box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(255,210,74,.6)}
                       100%{box-shadow:0 10px 26px rgba(0,0,0,.38)}}

  .kick{grid-area:kick;display:flex;flex-direction:column;justify-content:center;gap:1px;
        border-right:1px solid var(--line);padding-right:11px}
  .kt{font-size:15px;font-weight:900;letter-spacing:.2px}
  .ka{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:1px}
  .ks{font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.6px;margin-top:3px}

  .teams{grid-area:teams;display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}
  .trow{display:flex;align-items:center;gap:10px;min-width:0}
  .flag{font-size:21px;width:25px;text-align:center;flex:none;
        filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .tname{font-weight:700;font-size:16px;color:#cfd8e6;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;flex:1;min-width:0}
  .tname.win{color:#fff;font-weight:800}
  .tname.tbd{color:#5f6b80;font-style:italic;font-weight:600}
  .sc{font-variant-numeric:tabular-nums;font-weight:900;font-size:23px;min-width:24px;text-align:right;
      color:#fff;flex:none}
  .sc.dim{color:#3a445a;font-weight:800}
  .trow.win .sc{color:var(--gold)}

  .meta{grid-area:meta;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px}
  .badge{font-size:10px;font-weight:900;letter-spacing:.5px;padding:3px 10px;border-radius:999px;
         text-transform:uppercase;white-space:nowrap}
  .b-live{background:linear-gradient(135deg,#ff3b5c,#ff7a3b);color:#fff;animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,92,.55)}70%{box-shadow:0 0 0 11px rgba(255,59,92,0)}
                   100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}}
  .b-final{background:rgba(255,255,255,.1);color:#cdd6e6}
  .b-sched{background:rgba(124,92,255,.18);color:#bcaaff}
  .b-manual{background:linear-gradient(135deg,#ffd24a,#ff9d3b);color:#241a02}
  .edit{font-size:11px;color:var(--muted);background:none;border:none;padding:2px 4px;text-decoration:underline;font-weight:700}
  .editor{display:flex;align-items:center;gap:5px}
  .editor input{width:38px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
                color:#fff;border-radius:9px;padding:5px;text-align:center;font-size:16px;font-weight:800}

  .venue{grid-area:venue;font-size:11px;color:#6a7488;margin-top:9px;padding-top:9px;
         border-top:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{color:var(--muted);text-align:center;padding:54px 20px;font-weight:600}

  /* my-teams flair (your team = blue, liked = gold) */
  .flagbar{position:absolute;left:0;right:0;top:0;height:4px;background-size:200% 100%;animation:slide 3s linear infinite}
  .flagbar + .flagbar{top:4px}
  .flagbar.mine{background:linear-gradient(90deg,#5c8cff,#7cb5ff,#5c8cff,#7cb5ff)}
  .flagbar.liked{background:linear-gradient(90deg,#ffd24a,#ff9d3b,#ffd24a,#ff9d3b)}
  @keyframes slide{to{background-position:-200% 0}}
  .card.feat{padding-top:18px}
  .feat-mine{box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(92,140,255,.6)}
  .feat-liked{box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(255,210,74,.55)}
  .flags{display:flex;gap:3px;margin-bottom:1px}
  .flagwave{display:inline-block;font-size:18px;line-height:1;transform-origin:bottom center;
            animation:wave 1.3s ease-in-out infinite}
  .flagwave.d2{animation-delay:.4s}
  @keyframes wave{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(12deg) translateY(-2px)}}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .confetti-pc{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:1}}
  .goaltoast{position:fixed;left:50%;top:30%;transform:transl(-50%,-50%) scale(.6);z-index:60;
             font-size:40px;font-weight:900;letter-spacing:2px;pointer-events:none;opacity:0;
             background:linear-gradient(90deg,#19e08a,#ffd24a);-webkit-background-clip:text;background-clip:text;
             color:transparent;text-shadow:0 8px 30px rgba(0,0,0,.5)}
  .goaltoast.show{animation:toast 1.6s ease-out forwards}
  @keyframes toast{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
                   80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
                   100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  a{color:var(--accent)}

  /* Polymarket title-odds panel */
  .oddshdr{display:flex;align-items:center;gap:10px;margin:6px 4px 4px;flex-wrap:wrap}
  .oddshdr h2{font-size:16px;margin:0;font-weight:900;letter-spacing:.2px}
  .oddshdr .by{font-size:11px;color:var(--muted);font-weight:700}
  .oddshdr .by a{font-weight:800;text-decoration:none}
  .oddssub{font-size:11px;color:var(--muted);margin:0 4px 14px;line-height:1.5}
  .oddrow{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:9px;
          border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
          border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.32)}
  .oddrow .fill{position:absolute;left:0;top:0;bottom:0;z-index:0;border-radius:14px;
          background:linear-gradient(90deg,rgba(25,224,138,.22),rgba(124,92,255,.14));
          transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .oddrow.top1 .fill{background:linear-gradient(90deg,rgba(255,210,74,.32),rgba(255,157,59,.16))}
  .oddrow>*{position:relative;z-index:1}
  .oddrk{font-size:12px;font-weight:900;color:var(--muted);width:18px;text-align:center;flex:none}
  .oddrow.top1 .oddrk{color:var(--gold)}
  .oddflag{font-size:23px;width:27px;text-align:center;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .oddteam{font-weight:800;font-size:16px;color:#e7edf6;flex:1;min-width:0;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis}
  .oddpct{font-variant-numeric:tabular-nums;font-weight:900;font-size:19px;color:#fff;flex:none}
  .oddrow.top1 .oddpct{color:var(--gold)}
  .oddmove{font-size:14px;cursor:pointer;color:var(--accent);text-decoration:underline;font-weight:800}

  /* Squad / lineup (USA & Germany tabs) */
  .squad{margin-top:30px}
  .squadhdr{display:flex;align-items:center;gap:11px;margin:0 4px 4px;font-size:18px;font-weight:900}
  .squadhdr .sflag{font-size:24px}
  .squadcoach{font-size:12px;color:var(--muted);margin:0 4px 16px;font-weight:700}
  .squadcoach b{color:#cfd8e6}
  .posblock{margin-bottom:14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);
            background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02))}
  .poshd{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11px;font-weight:900;
         letter-spacing:1.4px;text-transform:uppercase;color:#04130c;
         background:linear-gradient(135deg,#19e08a,#0bbf93)}
  .poshd .dot{font-size:14px}
  .poshd .cnt{margin-left:auto;color:rgba(4,19,12,.7);letter-spacing:.5px}
  .posblock.df .poshd{background:linear-gradient(135deg,#7c5cff,#5b46c9);color:#fff}
  .posblock.mf .poshd{background:linear-gradient(135deg,#19c0e0,#0b8fbf);color:#02141a}
  .posblock.fw .poshd{background:linear-gradient(135deg,#ff7a3b,#ff3b5c);color:#fff}
  .plist{padding:4px 0}
  .prow{display:flex;align-items:baseline;gap:8px;padding:8px 15px;border-top:1px solid rgba(255,255,255,.05)}
  .prow:first-child{border-top:none}
  .pnum{font-variant-numeric:tabular-nums;font-weight:900;font-size:12px;color:#9aa6ba;width:26px;
        height:22px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:7px;
        background:rgba(255,255,255,.07);border:1px solid var(--line)}
  .pname{font-weight:800;font-size:15px;color:#e7edf6}
  .pname .cap{color:var(--gold);font-size:11px;font-weight:900;margin-left:5px;letter-spacing:.5px}
  .pclub{margin-left:auto;font-size:12px;color:#7c889e;font-weight:600;text-align:right;white-space:nowrap}

  /* Predicted XI — formation pitch */
  .pitch{position:relative;margin:2px 2px 6px;border-radius:16px;aspect-ratio:.72;max-width:440px;
         background:repeating-linear-gradient(180deg,#0d5d30 0,#0d5d30 8.33%,#0a5029 8.33%,#0a5029 16.66%);
         border:2px solid rgba(255,255,255,.22);overflow:hidden;
         box-shadow:inset 0 0 46px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.45)}
  .pitch .pline{position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.32)}
  .pitch .pcirc{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);
                border:2px solid rgba(255,255,255,.28);border-radius:50%}
  .pitch .pbox{position:absolute;left:24%;right:24%;height:12%;border:2px solid rgba(255,255,255,.24)}
  .pitch .pbox.t{top:0;border-top:none;border-radius:0 0 8px 8px}
  .pitch .pbox.b{bottom:0;border-bottom:none;border-radius:8px 8px 0 0}
  .dot{position:absolute;transform:translate(-50%,-50%);width:62px;text-align:center;z-index:2}
  .dot .num{width:33px;height:33px;margin:0 auto;border-radius:50%;display:flex;align-items:center;
            justify-content:center;font-weight:900;font-size:14px;color:#04130c;background:#fff;
            border:2px solid rgba(0,0,0,.18);box-shadow:0 3px 9px rgba(0,0,0,.5)}
  .dot.gk .num{background:var(--gold)}
  .dot .nm{margin-top:3px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95);
           white-space:nowrap;letter-spacing:.2px}

  /* ---- view switching (home / scores / recs) ---- */
  body[data-view="home"] header, body[data-view="home"] main{display:none}
  #home{display:none}
  body[data-view="home"] #home{display:flex}
  body[data-view="recs"] .controls,
  body[data-view="recs"] .filters,
  body[data-view="recs"] .status,
  body[data-view="recs"] .toggle{display:none}
  .backbtn{font-size:20px;line-height:1;padding:4px 11px;border-radius:11px;font-weight:900;
           background:var(--card);border:1px solid var(--line);color:var(--txt);margin-right:2px}

  /* ---- home menu: World Cup stadium theme ---- */
  #home{position:fixed;inset:0;z-index:30;flex-direction:column;align-items:center;justify-content:center;
        padding:28px;text-align:center;overflow:auto;
        background:radial-gradient(78% 55% at 50% -8%, rgba(255,210,74,.22), transparent 62%),
                   radial-gradient(72% 50% at 50% 112%, rgba(25,224,138,.20), transparent 62%),
                   radial-gradient(60% 45% at 50% 50%, rgba(124,92,255,.12), transparent 72%),
                   #05101a}
  .hbg{position:absolute;inset:0;pointer-events:none}
  .hbg.stripes{z-index:-2;background:repeating-linear-gradient(90deg,
               rgba(25,224,138,.045) 0 32px, rgba(25,224,138,.085) 32px 64px)}
  .hbg.pitchlines{z-index:-1}
  .hbg.pitchlines::before{content:"";position:absolute;left:9%;right:9%;top:50%;height:2px;
               background:rgba(255,255,255,.10);transform:translateY(-50%)}
  .hbg.pitchlines::after{content:"";position:absolute;left:50%;top:50%;width:170px;height:170px;
               transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.10);border-radius:50%}
  #home>.home-logo,#home>.home-title,#home>.home-tag,#home>.home-card,#home>.callout{position:relative;z-index:1}
  .home-logo{font-size:70px;line-height:1;filter:drop-shadow(0 8px 22px rgba(255,210,74,.6));margin-bottom:4px;
             animation:trophyFloat 3.4s ease-in-out infinite}
  @keyframes trophyFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
  .home-title{font-size:36px;margin:0;font-weight:900;letter-spacing:.4px;
              background:linear-gradient(90deg,#ffd24a,#19e08a 60%,#7c5cff);-webkit-background-clip:text;background-clip:text;color:transparent;
              text-shadow:0 4px 30px rgba(255,210,74,.15)}
  .home-tag{font-size:12px;color:#d6ddea;font-weight:800;margin:7px 0 28px;letter-spacing:2px}
  .home-card{display:flex;align-items:center;gap:16px;width:100%;max-width:430px;text-align:left;
             padding:20px 22px;margin-bottom:15px;border-radius:20px;
             background:rgba(8,10,16,.6);backdrop-filter:blur(10px) saturate(130%);
             -webkit-backdrop-filter:blur(10px) saturate(130%);
             border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .15s,border-color .15s}
  .home-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.35)}
  .home-card .hc-emoji{font-size:38px;flex:none}
  .home-card .hc-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
  .home-card .hc-txt b{font-size:19px;font-weight:900;color:#fff}
  .home-card .hc-txt small{font-size:12px;color:#c2cad8;font-weight:600;line-height:1.35}
  .home-card.rec{background:rgba(40,28,4,.62);border-color:rgba(255,210,74,.5);
                 box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 1px rgba(255,210,74,.25)}

  /* "Christian" callout pointing at the recommendations card */
  .callout{display:flex;flex-direction:column;align-items:center;gap:1px;max-width:430px;margin:2px 0 -3px}
  .callout-txt{font-size:13px;font-weight:800;color:#241a02;background:linear-gradient(135deg,#ffd24a,#ff9d3b);
               padding:8px 15px;border-radius:13px;text-align:center;line-height:1.35;transform:rotate(-1.6deg);
               box-shadow:0 6px 18px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4)}
  .callout-arrow{font-size:30px;color:#ffd24a;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.6);
                 animation:cbounce 1s ease-in-out infinite}
  @keyframes cbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

  /* ---- recommendations ---- */
  .recintro{font-size:12px;color:var(--muted);font-weight:600;line-height:1.5;margin:4px 4px 14px}
  .recintro b{color:#cfd8e6}
  .recnote{font-size:12px;color:var(--gold);font-weight:800;margin:0 4px 10px}
  .recnote .lk{cursor:pointer;text-decoration:underline;color:var(--accent)}
  .rsection{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:14px;font-weight:900;letter-spacing:.3px}
  .rsection .rcount{margin-left:auto;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.5px}
  .rsection::after{content:"";flex:0}
  .rcard{position:relative;padding:14px 15px 13px 18px;border-radius:16px;margin-bottom:11px;overflow:hidden;
         background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
         border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.34)}
  .rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .rcard.t-must::before{background:linear-gradient(180deg,#ff3b5c,#ff7a3b)}
  .rcard.t-worth::before{background:linear-gradient(180deg,#19e08a,#0bbf93)}
  .rcard.t-skip::before{background:rgba(255,255,255,.18)}
  .rteams{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .rteams .flag{font-size:20px;width:24px;text-align:center}
  .rteams .rt{font-weight:800;font-size:16px;color:#eef2fa}
  .rteams .rvs{font-size:11px;color:var(--muted);font-weight:800;margin:0 1px}
  .rmeta{font-size:11px;color:#6a7488;font-weight:700;margin-top:5px;letter-spacing:.3px;text-transform:uppercase}
  .rreason{font-size:13px;color:#cdd6e6;font-weight:600;margin-top:9px;line-height:1.4}
  .rreason i{color:#aeb8c9}
  .rfoot{margin-top:11px}

// ---- team name canonicalization ----
function canon(name){
  if(!name) return "";
  let s = name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/[^a-z0-9]/g,"");
  const alias = {
    turkey:"turkiye", trkiye:"turkiye", czechrepublic:"czechia",
    cotedivoire:"ivorycoast", drcongo:"congodr", democraticrepublicofthecongo:"congodr",
    congodemocraticrepublic:"congodr", korearepublic:"southkorea",
    usa:"unitedstates", unitedstatesofamerica:"unitedstates", us:"unitedstates",
    caboverde:"capeverde", bosniaherzegovina:"bosniaandherzegovina",
    irislamicrepublic:"iran", iranislamicrepublic:"iran",
  };
  return alias[s] || s;
}
function pairKey(a,b){ return [canon(a),canon(b)].sort().join("__"); }
function flag(team){ if(!team) return "🏳️"; return FLAGS[canon(team)] || "⚽"; }

const pairToId = {};

// ---- date helpers ----
function ymd(iso){ return iso.replace(/-/g,""); }
function todayLocalYMD(){
  const d=new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
function ymdShift(s, delta){
  const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)); d.setDate(d.getDate()+delta);
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
const ALL_DATES = [...new Set(MATCHES.map(m=>ymd(m.date)))].sort();

// ---- ESPN fetch + merge ----
async function fetchScoreboard(dateYMD){
  const path = `https://site.api.espn.com/apis/site/v2/sports/soccer/${LEAGUE}/scoreboard?dates=${dateYMD}`;
  try{
    const r = await fetch(path, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    const r2 = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(path), {cache:"no-store"});
    if(!r2.ok) throw new Error("proxy HTTP "+r2.status);
    return await r2.json();
  }
}
let goalIds = [];
function ingest(data){
  let seen=0, matched=0;
  (data.events||[]).forEach(ev=>{
    seen++;
    const comp = (ev.competitions||[])[0]; if(!comp) return;
    const cs = comp.competitors||[]; if(cs.length<2) return;
    const A=cs[0], B=cs[1];
    const nameA=(A.team&&(A.team.displayName||A.team.name))||A.displayName;
    const nameB=(B.team&&(B.team.displayName||B.team.name))||B.displayName;
    const id = pairToId[pairKey(nameA,nameB)]; if(!id) return;
    const m = MATCHES.find(x=>x.id===id);
    const map={}; map[canon(nameA)]=A.score; map[canon(nameB)]=B.score;
    const sh=map[canon(m.home)], sa=map[canon(m.away)];
    const st=(ev.status&&ev.status.type)||{};
    const state = st.state||"pre";
    const started = state==="in" || state==="post";
    const prev = store[id];
    if(prev && prev.src==="manual") return;
    const nh = started && sh!==undefined ? Number(sh) : null;
    const na = started && sa!==undefined ? Number(sa) : null;
    // detect a new goal vs what we had before (for confetti)
    if(prev && prev.h!=null && nh!=null && (nh>prev.h || na>prev.a)) goalIds.push(id);
    store[id] = { h:nh, a:na, status: state==="in"?"live":(state==="post"?"final":"sched"),
                  det: st.shortDetail||st.detail||"", src:"api" };
    matched++;
  });
  return {seen, matched};
}

async function refresh(dates){
  const btn=document.getElementById("refresh"), sync=document.getElementById("syncall");
  btn.disabled=true; sync.disabled=true; setStatus("Fetching latest scores…");
  goalIds=[];
  let matched=0, seen=0, errors=0;
  await Promise.all(dates.map(d=>
    fetchScoreboard(d).then(j=>{ const r=ingest(j); matched+=r.matched; seen+=r.seen; })
                      .catch(()=>{ errors++; })));
  save(); render();
  if(goalIds.length) celebrateGoals(goalIds);
  const t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  setStatus(errors===dates.length
    ? `⚠️ Couldn't reach the scores feed (all ${errors} requests failed). Showing saved scores — tap Edit to enter scores by hand. ${t}`
    : `Updated ${matched} score(s) · ${seen} games seen in feed · ${dates.length} day(s) checked${errors?` · ${errors} failed`:""} · ${t} · ${APP_VERSION}`);
  btn.disabled=false; sync.disabled=false;
}
function recentDates(){
  const today=todayLocalYMD();
  const set=new Set(ALL_DATES.filter(d=>d<=today).slice(-3));
  set.add(today); set.add(ymdShift(today,1));   // late-night games file on the next day
  return [...set];
}

async function fetchOddsJSON(){

    if(!r2.ok) throw new Error("proxy HTTP "+r2.status);
    return await r2.json();
  }

function parseNum(v){ if(typeof v==="number") return v; if(typeof v!=="string") return null;
  const n=Number(v); return isFinite(n)?n:null; }
function parseArr(v){ if(Array.isArray(v)) return v; if(typeof v==="string"){ try{return JSON.parse(v);}catch(e){} } return null; }
// A multi-outcome event is a list of binary (Yes/No) markets, one per team.
function parseOdds(data){
  const ev = Array.isArray(data) ? data[0] : (data.events ? data.events[0] : data);
  const markets = (ev && ev.markets) || [];
  const out = [];
  markets.forEach(mk=>{
    if(mk.closed) return;
    const team = mk.groupItemTitle || mk.question || mk.title;
    if(!team) return;
    // "Yes" price = implied probability the team wins
    let p = null;
    const prices = parseArr(mk.outcomePrices);
    const names  = parseArr(mk.outcomes);
    if(prices && names){ const yi=names.findIndex(n=>/yes/i.test(n)); p = parseNum(prices[yi>=0?yi:0]); }
    if(p==null) p = parseNum(mk.lastTradePrice);
    if(p==null && mk.bestBid!=null && mk.bestAsk!=null) p=(parseNum(mk.bestBid)+parseNum(mk.bestAsk))/2;
    if(p==null) return;
    out.push({team: team.trim(), prob: p});
  });
  out.sort((a,b)=>b.prob-a.prob);
  return out;
}
async function loadOdds(force){
  if(oddsLoading) return;
  if(!force && odds && Date.now()-oddsTs < 5*60*1000) return;   // fresh enough
  oddsLoading=true; if(activeFilter===ODDS_TAB) render(); else if(view==="recs") renderRecs();
  try{
    const list = parseOdds(await fetchOddsJSON());
    if(list.length){ odds=list; oddsTs=Date.now();
      localStorage.setItem(LS_ODDS, JSON.stringify({list:odds, ts:oddsTs})); }
  }catch(e){ /* keep any cached odds; renderOdds shows a notice */ }
  oddsLoading=false; if(activeFilter===ODDS_TAB) render(); else if(view==="recs") renderRecs();
}
function agoLabel(ms){ if(!ms) return ""; const s=Math.round((Date.now()-ms)/1000);
  if(s<60) return "just now"; const m=Math.round(s/60); if(m<60) return m+"m ago";
  return Math.round(m/60)+"h ago"; }
function renderOdds(){
  const link=`https://polymarket.com/event/${POLY_SLUG}`;
  let head=`<div class="oddshdr"><h2>🏆 Who wins it all?</h2>
    <span class="by">live bettor odds · <a href="${link}" target="_blank" rel="noopener">Polymarket ↗</a></span></div>
    <p class="oddssub">Implied chance each nation lifts the trophy, from real-money prediction markets${oddsTs?` · updated ${agoLabel(oddsTs)}`:""}. <span class="oddmove" id="oddrefresh">↻ refresh</span></p>`;
  if(oddsLoading && !odds) return head+`<div class="empty">Loading market odds…</div>`;
  if(!odds || !odds.length) return head+`<div class="empty">Couldn't reach Polymarket right now. Tap ↻ refresh to retry, or open the <a href="${link}" target="_blank" rel="noopener">market ↗</a>.</div>`;
  const max=odds[0].prob||1;
  const rows=odds.slice(0,16).map((o,i)=>{
    const pct=o.prob*100, w=Math.max(4,(o.prob/max)*100);
    const show=pct>=1?Math.round(pct):pct.toFixed(1);
    return `<div class="oddrow ${i===0?"top1":""}"><div class="fill" style="width:${w}%"></div>
      <span class="oddrk">${i+1}</span><span class="oddflag">${flag(o.team)}</span>
      <span class="oddteam">${o.team}</span><span class="oddpct">${show}%</span></div>`;
  }).join("");
  return head+rows;
}

function matchRow(m){
  const sc = store[m.id] || {};
  const live = sc.status==="live";
  const hasScore = sc.h!=null && sc.a!=null;
  const homeWin = hasScore && sc.h>sc.a, awayWin = hasScore && sc.a>sc.h;
  const tbd = !(m.home&&m.away);
  const [kt, ka] = m.time.split(" ");
  const ks = STAGE_SHORT[m.stage]||"";

  let badge;
  if(sc.src==="manual") badge=`<span class="badge b-manual">edited</span>`;
  else if(live) badge=`<span class="badge b-live">● LIVE${sc.det?(" "+sc.det):""}</span>`;
  else if(sc.status==="final") badge=`<span class="badge b-final">Full time</span>`;
  else badge=`<span class="badge b-sched">${kt} ${ka||""}</span>`;

  const scH = hasScore? sc.h : "–", scA = hasScore? sc.a : "–";
  const dimH = hasScore?"":" dim", dimA = hasScore?"":" dim";

  const feats = featsFor(m);
  let featCls="", flagbars="", waves="";
  if(feats.length){
    featCls = " feat " + feats.map(f=>"feat-"+f.type).join(" ");
    flagbars = feats.map(f=>`<div class="flagbar ${f.type}"></div>`).join("");
    waves = `<div class="flags">`+feats.map((f,i)=>`<span class="flagwave ${i?"d2":""}">${f.flag}</span>`).join("")+`</div>`;
  }

  return `<div class="card ${live?"live":""}${featCls}" data-id="${m.id}">
    ${flagbars}
    <div class="kick"><span class="kt">${kt}</span><span class="ka">${ka||""}</span>${ks?`<span class="ks">${ks}</span>`:""}</div>
    <div class="teams">
      <div class="trow ${homeWin?"win":""}"><span class="flag">${flag(m.home)}</span><span class="tname ${homeWin?"win":""} ${tbd?"tbd":""}">${m.home||"TBD"}</span><span class="sc${dimH}">${scH}</span></div>
      <div class="trow ${awayWin?"win":""}"><span class="flag">${flag(m.away)}</span><span class="tname ${awayWin?"win":""} ${tbd?"tbd":""}">${m.away||"TBD"}</span><span class="sc${dimA}">${scA}</span></div>
    </div>
    <div class="meta">${waves}${badge}<button class="edit" data-edit="${m.id}">Edit</button></div>
    <div class="venue">${m.venue}</div>
  </div>`;
}

function render(){

  fc.innerHTML=FILTERS.map(f=>`<button class="${f===activeFilter?"on":""}" data-f="${f}">${f}</button>`).join("");

  if(activeFilter===ODDS_TAB){
    document.getElementById("list").innerHTML=renderOdds();
    loadOdds(false);
    return;
  }

  let list = MATCHES.slice();
  const featTab = featuredList().find(f=>f.label===activeFilter);
  if(activeFilter==="Today") list=list.filter(m=>isToday(m.date));
  else if(activeFilter==="Live") list=list.filter(m=>(store[m.id]||{}).status==="live");
  else if(featTab) list=list.filter(m=>involves(m,featTab.team));
  else if(STAGES.includes(activeFilter)) list=list.filter(m=>m.stage===activeFilter);

  const host=document.getElementById("list");
  const squadHTML = featTab ? (renderXI(featTab.team) + renderSquad(featTab.team)) : "";
  if(!list.length){
    host.innerHTML=`<div class="empty">${activeFilter==="Today"?"No matches scheduled for today.":
      activeFilter==="Live"?"No matches are live right now.":
      featTab?`No ${featTab.team} matches found.`:"No matches."}</div>`+squadHTML;
    return;
  }
  const byDate={}; list.forEach(m=>{ (byDate[m.date]=byDate[m.date]||[]).push(m); });
  host.innerHTML=Object.keys(byDate).sort().map(d=>
    `<div class="daygroup"><div class="dayhdr">${dayLabel(d)}${isToday(d)?` <span class="pill-today">TODAY</span>`:""}</div>${byDate[d].map(matchRow).join("")}</div>`

}

// ---- game recommendations (spoiler-free) ----
// BUZZ[id] = [level, blurb]  level: 1 = good reviews, 2 = "instant classic / amazing".
// Blurbs are kept score-free. Easily editable — add games as the buzz comes in.
const BUZZ = {
  10: [2, "Hailed as an instant epic — a tactical end-to-end thriller"], // Netherlands v Japan
  19: [2, "A Messi masterclass that had the world talking"],            // Argentina v Algeria
};
const TIERS = {
  must:  {label:"Must see",       emoji:"🔥", cls:"t-must",  pill:"tp-must"},
  worth: {label:"Worth watching", emoji:"👍", cls:"t-worth", pill:"tp-worth"},
  skip:  {label:"Probably skip",  emoji:"😴", cls:"t-skip",  pill:"tp-skip"},
};
// classification rules requested:
//  5+ goals -> must · 3+ goals -> worth · "amazing" buzz -> must · 3+ goals AND good reviews -> must · good reviews -> worth
function recommend(goals, buzz){
  if(goals>=5) return "must";
  if(buzz>=2) return "must";
  if(goals>=3 && buzz>=1) return "must";
  if(goals>=3) return "worth";
  if(buzz>=1) return "worth";
  return "skip";
}
function reasonFor(tier, goals, buzz){
  if(tier==="must"){
    if(buzz>=2) return "🔥 Critics are calling it an instant classic";
    if(goals>=5) return "🔥 A goal-fest from first whistle to last";
    if(goals>=3 && buzz>=1) return "🔥 End-to-end and very well reviewed";
    return "🔥 Unmissable";
  }
  if(tier==="worth"){
    if(goals>=3 && buzz>=1) return "👍 Goals plus solid reviews";
    if(goals>=3) return "👍 Good value for goals";
    return "👍 Earned strong reviews";
  }
  return "😴 Likely a cagey, low-scoring one";
}
function isFinished(m){
  const s=store[m.id];
  return !!(s && s.h!=null && s.a!=null && (s.status==="final" || ymd(m.date)<todayLocalYMD()));
}

let upSort = localStorage.getItem("wc26.upsort.v1") || "rating";      // "rating" | "date"
const PRED_NAMES = {must:"Must-watch", worth:"Worth watching", skip:"Low-key"};
function timeMin(t){ const x=/(\d+):(\d+)\s*(AM|PM)/i.exec(t||""); if(!x) return 0;
  let h=+x[1]%12; if(/pm/i.test(x[3])) h+=12; return h*60 + +x[2]; }

async function loadHistory(force){
  if(histLoading) return;
  if(histLoaded && !force) return;
  histLoading=true; if(view==="recs") renderRecs();
  const today=todayLocalYMD();
  const dates=[...new Set([...ALL_DATES.filter(d=>d<=today), today])];
  await Promise.all(dates.map(d=>fetchScoreboard(d).then(j=>ingest(j)).catch(()=>{})));

function recCard(m, tier, goals, buzz, showPill){
  const s=store[m.id]||{};
  const reveal = revealed.has(m.id)
    ? `<span class="rscore">${s.h} – ${s.a}</span>`
    : `<button class="rreveal" data-reveal="${m.id}">👁 Reveal score</button>`;
  const blurb = BUZZ[m.id] && BUZZ[m.id][1] ? ` — <i>${BUZZ[m.id][1]}</i>` : "";
  const tags=teamTags(m);
  const tag = tags.mine ? `<span class="mine">💙 Your team!</span> `
            : (tags.liked.length ? `<span class="liked">⭐ ${tags.liked.join(", ")}</span> ` : "");
  const pill = showPill ? ` · <span class="tagpill ${TIERS[tier].pill}">${TIERS[tier].emoji} ${TIERS[tier].label}</span>` : "";
  return `<div class="rcard ${TIERS[tier].cls}">
    <div class="rteams"><span class="flag">${flag(m.home)}</span><span class="rt">${m.home}</span>
      <span class="rvs">v</span><span class="rt">${m.away}</span><span class="flag">${flag(m.away)}</span></div>
    <div class="rmeta">${STAGE_SHORT[m.stage]||m.stage} · ${dayLabel(m.date)}${pill}</div>
    <div class="rreason">${tag}${reasonFor(tier,goals,buzz)}${blurb}</div>
    <div class="rfoot">${reveal}</div>
  </div>`;
}
function playedHTML(){
  const fin = MATCHES.filter(isFinished).filter(m=>m.home&&m.away);
  if(!fin.length) return histLoading
    ? `<div class="empty">Loading recent results…</div>`
    : `<div class="empty">No finished games to rate yet.<br>Check back once the first matches have been played.</div>`;
  const rated = fin.map(m=>{ const s=store[m.id]; const goals=(s.h||0)+(s.a||0); const buzz=(BUZZ[m.id]||[0])[0];
    let tier=recommend(goals,buzz); const tags=teamTags(m);
    if(tags.mine) tier="must"; else if(tags.liked.length&&tier==="skip") tier="worth";
    return {m,goals,buzz,tier,mine:tags.mine}; });
  let html = `<p class="recintro">Finished games — <b>scores stay hidden</b> until you tap reveal. Switch between <b>Best first</b> (ranked by watch value) and <b>By date</b> (newest → oldest, every game).</p>`;
  html += histLoading ? `<div class="recnote">↻ Updating results…</div>`
                      : `<div class="recnote"><span class="lk" data-recrefresh>↻ Refresh results</span></div>`;
  html += `<div class="psort">
    <button class="ps ${playedSort==="rating"?"on":""}" data-psort="rating">⭐ Best first</button>
    <button class="ps ${playedSort==="date"?"on":""}" data-psort="date">🗓️ By date</button></div>`;
  if(playedSort==="date"){
    const byDate={}; rated.forEach(o=>{ (byDate[o.m.date]=byDate[o.m.date]||[]).push(o); });
    html += Object.keys(byDate).sort().reverse().map(d=>{
      const items=byDate[d].sort((a,b)=>b.m.id-a.m.id);
      return `<div class="rsection daysec">${dayLabel(d)}${isToday(d)?` <span class="pill-today">TODAY</span>`:""}<span class="rcount">${items.length} game${items.length>1?"s":""}</span></div>`
           + items.map(o=>recCard(o.m,o.tier,o.goals,o.buzz,true)).join("");
    }).join("");
  } else {
    const groups={must:[],worth:[],skip:[]}; rated.forEach(o=>groups[o.tier].push(o));
    const byDateDesc=(a,b)=>((b.mine?1:0)-(a.mine?1:0))||(a.m.date<b.m.date?1:a.m.date>b.m.date?-1:b.m.id-a.m.id);
    ["must","worth","skip"].forEach(t=>{
      const items=groups[t]; if(!items.length) return; items.sort(byDateDesc);
      html += `<div class="rsection"><span class="tagpill ${TIERS[t].pill}">${TIERS[t].emoji} ${TIERS[t].label}</span><span class="rcount">${items.length} game${items.length>1?"s":""}</span></div>`;
      html += items.map(o=>recCard(o.m, o.tier, o.goals, o.buzz)).join("");
    });
  }
  return html;
}

  switzerland:[0,0,0,3], colombia:[0,0,0,1], ghana:[0,0,0,1], senegal:[0,0,0,1], japan:[0,0,0,0],
  australia:[0,0,0,0], ecuador:[0,0,0,0], paraguay:[0,0,0,1], algeria:[0,0,0,0], ivorycoast:[0,0,0,0],
  scotland:[0,0,0,0], iran:[0,0,0,0], saudiarabia:[0,0,0,0], tunisia:[0,0,0,0], egypt:[0,0,0,0],
  norway:[0,0,0,0], austria:[0,0,2,3], sweden:[0,1,4,5], czechia:[0,2,3,3], southafrica:[0,0,0,0],
  canada:[0,0,0,0], qatar:[0,0,0,0], iraq:[0,0,0,0], uzbekistan:[0,0,0,0], panama:[0,0,0,0],
  newzealand:[0,0,0,0], jordan:[0,0,0,0], capeverde:[0,0,0,0], haiti:[0,0,0,0], curacao:[0,0,0,0],
  congodr:[0,0,0,0], bosniaandherzegovina:[0,0,0,0]
};
// recency bump (recent titles / deep runs weighted more than old ones)
const WC_RECENT = { argentina:25, france:14, croatia:9, morocco:9, england:6, netherlands:4, brazil:3, portugal:3, spain:4 };
const POWER = (function(){
  const raw={}; let max=1;
  for(const k in WC_HISTORY){ const [t,f,s,q]=WC_HISTORY[k];
    raw[k]= t*12 + f*6 + s*3 + q*1.5 + (WC_RECENT[k]||0); if(raw[k]>max) max=raw[k]; }
  const P={}; for(const k in raw) P[k]=Math.round(Math.sqrt(raw[k]/max)*100); // sqrt curve spreads the field
  return P;
})();
function powerOf(team){ const p=POWER[canon(team)]; return p==null?12:p; }   // unknown nations: modest floor
// only true "watch the game just for this player" draws score points
const MEGASTARS = { argentina:"Messi", portugal:"Ronaldo", france:"Mbappé" };
const HOSTS = ["unitedstates","canada","mexico"];
const STAGE_PTS = {"Final":34,"Semifinals":30,"Quarterfinals":24,"Round of 16":18,"Round of 32":12,
                   "Third-Place Match":14,"Group Stage":0};
function teamRecord(team){
  const c=canon(team); let pld=0,pts=0,gf=0,ga=0;
  MATCHES.forEach(m=>{ if(!m.home||!m.away||!isFinished(m)) return; const s=store[m.id];
    let us,th; if(canon(m.home)===c){us=s.h;th=s.a;} else if(canon(m.away)===c){us=s.a;th=s.h;} else return;
    pld++; gf+=us; ga+=th; pts+= us>th?3:us===th?1:0; });
  return {pld,pts,gf,ga,gd:gf-ga};
}
function formScore(team){ const r=teamRecord(team); if(!r.pld) return {s:50,r};
  let s=50+((r.pts/r.pld)-1)*22+(r.gd/r.pld)*8; return {s:Math.max(12,Math.min(100,s)),r}; }
function oddsProb(team){ if(!odds) return null; const c=canon(team); const e=odds.find(o=>canon(o.team)===c); return e?e.prob:0; }
function teamQuality(team){
  const ped=powerOf(team), fo=formScore(team), p=oddsProb(team);
  const f = fo.r.pld ? fo.s : null;                 // only use form once they've actually played
  const mk = p==null ? null : Math.min(100,p*100*4); // market title odds, if loaded
  if(f==null && mk==null) return ped;               // pre-tournament: powerhouse carries it
  if(mk==null) return .60*ped+.40*f;
  if(f==null)  return .70*ped+.30*mk;
  return .45*ped+.30*f+.25*mk;
}
function predictMatch(m){
  const A=m.home,B=m.away, ca=canon(A),cb=canon(B);
  const qa=teamQuality(A), qb=teamQuality(B);
  const factors=[]; let raw=0;
  const add=(label,pts)=>{ if(pts>0.5){ factors.push({label,pts:Math.round(pts)}); raw+=pts; } };
  // 1) the matchup (opponent score): a high team lifts any pairing; mid vs mid gets a little;
  //    low vs low earns nothing (e.g. Switzerland–Canada)
  const lo=Math.min(qa,qb), hi=Math.max(qa,qb);
  const clashPts = Math.max(0,hi-38)/62*28 + Math.max(0,lo-38)/62*20;   // 0 unless someone is mid+
  let cl; if(lo>=70) cl="🥊 Heavyweight clash — two elite sides";
  else if(hi>=70) cl="🌟 A genuine contender on show";
  else cl="Two mid-tier sides";
  add(cl, clashPts);
  // 2) powerhouse pedigree (objective: WC titles / finals / semis / QFs)
  const powAvg=(powerOf(A)+powerOf(B))/2;
  if(powAvg>=30) add(`🏛️ Pedigree (${powerOf(A)}/${powerOf(B)} powerhouse score)`, Math.min(12, (powAvg-30)/70*12));
  // 3) stage / stakes — group games score 0 here; knockouts = single elimination
  if(m.stage!=="Group Stage") add(`🏆 ${m.stage} — win or go home`, STAGE_PTS[m.stage]??10);
  else {
    const ra=teamRecord(A), rb=teamRecord(B), need=[];
    if(ra.pld>=1&&ra.pts<=1) need.push(A); if(rb.pld>=1&&rb.pts<=1) need.push(B);
    if(need.length) add(`⚡ Must-win to stay alive (${need.join(" & ")})`, need.length>1?10:7);
  }
  // 4) megastar draw — only the genuine "watch just for the player" names
  const st=[]; if(MEGASTARS[ca]) st.push(MEGASTARS[ca]); if(MEGASTARS[cb]) st.push(MEGASTARS[cb]);
  if(st.length) add("⭐ Watch for "+st.join(" & "), Math.min(16, st.length*10));
  // 5) prediction markets (Polymarket title odds)
  const pa=oddsProb(A), pb=oddsProb(B);
  if(pa!=null && (pa+pb)>0.02) add(`📊 Market fancy them (${Math.round(pa*100)}% / ${Math.round(pb*100)}% to win it all)`, Math.min(10,(pa+pb)*32));
  // 6) high-scoring team bonus — sides averaging more than 2 goals scored per game
  const hot=[]; [A,B].forEach(t=>{ const r=teamRecord(t);
    if(r.pld>=1 && r.gf/r.pld>2) hot.push(`${t} ${(r.gf/r.pld).toFixed(1)}`); });
  if(hot.length) add(`🔥 High-scoring side (${hot.join(", ")} goals/game)`, Math.min(9, hot.length*5));
  // 7) surprise score — teams beating expectations (results better than their powerhouse rank predicts)
  const surpName=[], surpFor=(t)=>{ const r=teamRecord(t); if(r.pld<1) return 0;
    return (r.pts/r.pld/3) - (powerOf(t)/100); };           // actual win-rate minus expected
  let surpPts=0; [A,B].forEach(t=>{ const sv=surpFor(t); if(sv>0.18){ surpName.push(t); surpPts=Math.max(surpPts,Math.min(10,sv*16)); } });
  if(surpName.length) add(`🐎 Beating expectations (${surpName.join(" & ")})`, surpPts);
  // 8) host-nation buzz
  const home=[A,B].filter(t=>HOSTS.includes(canon(t)));
  if(home.length) add(`🎉 Home crowd (${home.join(" & ")})`, 4);
  // tier — hard overrides: SF & Final are automatic must-watch; a megastar is always worth tuning in for
  let tier;
  if(m.stage==="Final"||m.stage==="Semifinals"){ tier="must"; raw=Math.max(raw,84);
    factors.unshift({label:`✅ ${m.stage} — automatic must-watch`, pts:0}); }
  else { tier = raw>=64 ? "must" : raw>=40 ? "worth" : "skip";
    if(tier==="skip" && st.length) tier="worth"; }   // Messi / Ronaldo / Mbappé floor
  // personalization overrides
  const tags=teamTags(m);
  if(tags.mine){ tier="must"; raw=Math.max(raw,90); factors.unshift({label:"💙 Your team — must watch!", pts:0}); }
  else if(tags.liked.length){ factors.unshift({label:`⭐ A team you like (${tags.liked.join(", ")})`, pts:0}); if(tier==="skip") tier="worth"; }
  return {score:Math.min(100,Math.round(raw)), tier, factors, mine:tags.mine};
}
function predCard(m,p,showPill){
  const max=Math.max(1,...p.factors.map(f=>f.pts));
  const bars=p.factors.map(f=>
    `<div class="pf"><span class="pfl">${f.label}</span><span class="pfb"><i style="width:${Math.round(f.pts/max*100)}%"></i></span><span class="pfp">${f.pts?("+"+f.pts):"—"}</span></div>`).join("");
  const pill = showPill ? ` · <span class="tagpill ${TIERS[p.tier].pill}">${TIERS[p.tier].emoji} ${PRED_NAMES[p.tier]}</span>` : ` · watchability ${p.score}/100`;
  return `<div class="rcard ${TIERS[p.tier].cls}">
    <div class="rteams"><span class="flag">${flag(m.home)}</span><span class="rt">${m.home}</span>
      <span class="rvs">v</span><span class="rt">${m.away}</span><span class="flag">${flag(m.away)}</span>
      <span class="pscore">${p.score}</span></div>
    <div class="rmeta">${STAGE_SHORT[m.stage]||m.stage} · ${dayLabel(m.date)} · ${m.time}${pill}</div>
    <div class="pfactors">${bars}</div>
  </div>`;
}
function predictHTML(){
  const up=MATCHES.filter(m=>m.home&&m.away&&!isFinished(m));
  const loading=histLoading||oddsLoading;
  let html=`<p class="recintro">Upcoming games ranked by an integrated <b>watchability score</b> (0–100). Factors: the matchup (a strong team lifts any tie, two low sides score nothing), an <b>objective powerhouse score</b> (WC titles/finals/semis/QFs, recent weighted higher), megastar draws (Messi · Ronaldo · Mbappé), stakes — <b>semis &amp; final are automatic must-watch</b> — must-win games, a <b>surprise score</b> for teams beating expectations, high-scoring sides, host buzz &amp; live market odds. Each card shows the math.</p>`;
  html += loading ? `<div class="recnote">↻ Crunching form &amp; market odds…</div>`
                  : `<div class="recnote"><span class="lk" data-recrefresh>↻ Refresh data</span></div>`;
  if(!up.length) return html+`<div class="empty">No upcoming games with confirmed teams yet.</div>`;
  html += `<div class="psort">
    <button class="ps ${upSort==="rating"?"on":""}" data-upsort="rating">⭐ Best first</button>
    <button class="ps ${upSort==="date"?"on":""}" data-upsort="date">🗓️ By date</button></div>`;
  if(upSort==="date"){
    const scored=up.map(m=>({m,p:predictMatch(m)}));
    const byDate={}; scored.forEach(o=>{ (byDate[o.m.date]=byDate[o.m.date]||[]).push(o); });
    html += Object.keys(byDate).sort().map(d=>{
      const items=byDate[d].sort((a,b)=>timeMin(a.m.time)-timeMin(b.m.time)||a.m.id-b.m.id);
      return `<div class="rsection daysec">${dayLabel(d)}${isToday(d)?` <span class="pill-today">TODAY</span>`:""}<span class="rcount">${items.length} game${items.length>1?"s":""}</span></div>`
           + items.map(o=>predCard(o.m,o.p,true)).join("");
    }).join("");
  } else {
    const groups={must:[],worth:[],skip:[]};
    up.forEach(m=>{ const p=predictMatch(m); groups[p.tier].push({m,p}); });
    const byDate=(a,b)=>((b.p.mine?1:0)-(a.p.mine?1:0))||(a.m.date<b.m.date?-1:a.m.date>b.m.date?1:a.m.id-b.m.id);
    ["must","worth","skip"].forEach(t=>{ const items=groups[t]; if(!items.length) return; items.sort(byDate);
      html+=`<div class="rsection"><span class="tagpill ${TIERS[t].pill}">${TIERS[t].emoji} ${PRED_NAMES[t]}</span><span class="rcount">${items.length} game${items.length>1?"s":""}</span></div>`;
      html+=items.map(it=>predCard(it.m,it.p)).join("");
    });
  }
  return html;
}
let recMode = "upcoming";
function renderRecs(){
  const host=document.getElementById("list");
  const toggle=`<div class="recmodes">
    <button class="rm ${recMode==="upcoming"?"on":""}" data-rm="upcoming">🔮 Coming up</button>
    <button class="rm ${recMode==="played"?"on":""}" data-rm="played">🎬 Already played</button></div>`;

}
