<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>World Cup 2026 — My Tracker</title>
<style>
  :root{
    --bg:#070a12; --txt:#eef2fa; --muted:#7c889e;
    --accent:#19e08a; --accent2:#7c5cff; --gold:#ffd24a; --live:#ff3b5c;
    --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--txt);font-size:15px;line-height:1.4;
       padding-bottom:env(safe-area-inset-bottom)}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
     radial-gradient(60% 50% at 12% -5%,rgba(124,92,255,.22),transparent 60%),
     radial-gradient(55% 45% at 105% 8%,rgba(25,224,138,.16),transparent 60%),
     radial-gradient(70% 60% at 50% 110%,rgba(255,210,74,.08),transparent 60%)}
  body::after{content:"";position:fixed;inset:-50%;z-index:-3;pointer-events:none;opacity:.04;
     background:radial-gradient(circle at 20% 30%,#fff 0,transparent 1px) 0 0/26px 26px}

  header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
         background:rgba(7,10,18,.72);backdrop-filter:blur(16px) saturate(140%);
         -webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{font-size:28px;line-height:1;filter:drop-shadow(0 3px 8px rgba(255,210,74,.45));cursor:pointer;
         transition:transform .2s}
  .logo:active{transform:scale(.9)}
  .logo.spin{animation:spin .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes spin{to{transform:rotate(360deg) scale(1.15)}}
  h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.3px;
     background:linear-gradient(90deg,#19e08a,#7c5cff 75%);-webkit-background-clip:text;
     background-clip:text;color:transparent}
  .sub{font-size:11px;color:var(--muted);margin-top:1px;font-weight:600;letter-spacing:.3px}
  .grow{flex:1}
  .toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-weight:600}

  .controls{display:flex;align-items:center;gap:9px;margin-top:13px;flex-wrap:wrap}
  button{cursor:pointer;font:inherit;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:800;
         color:var(--txt);background:var(--card);border:1px solid var(--line);transition:.15s}
  button:active{transform:scale(.96)}
  button.primary{background:linear-gradient(135deg,#19e08a,#0bbf93);color:#04130c;border-color:transparent;
                 box-shadow:0 8px 22px rgba(25,224,138,.32)}
  button.primary:disabled{opacity:.55}

  .filters{display:flex;gap:8px;margin-top:13px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{white-space:nowrap;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
                  color:#aeb8c9;flex:0 0 auto}
  .filters button.on{background:linear-gradient(135deg,#19e08a,#0bbf93);color:#04130c;border-color:transparent;
                     box-shadow:0 5px 16px rgba(25,224,138,.35)}
  .status{font-size:11px;color:var(--muted);margin-top:11px;line-height:1.5}

  main{max-width:760px;margin:0 auto;padding:8px 12px 70px}
  .dayhdr{display:flex;align-items:center;gap:11px;margin:24px 4px 13px;font-size:12px;font-weight:900;
          letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .dayhdr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .pill-today{color:#04130c;background:linear-gradient(135deg,#19e08a,#0bbf93);padding:2px 9px;
              border-radius:999px;font-size:10px;letter-spacing:.5px}

  .card{position:relative;display:grid;grid-template-columns:54px 1fr auto;
        grid-template-areas:"kick teams meta" "venue venue venue";gap:2px 14px;
        padding:14px;border-radius:18px;margin-bottom:12px;overflow:hidden;
        background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
        border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.38);
        backdrop-filter:blur(8px);transition:transform .16s,box-shadow .16s,border-color .16s}
  .card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18);box-shadow:0 16px 34px rgba(0,0,0,.5)}
  .card.live{border-color:rgba(255,59,92,.55);
             box-shadow:0 0 0 1px rgba(255,59,92,.4),0 12px 32px rgba(255,59,92,.2)}
  .card.goal{animation:goalflash 1.1s ease-out}
  @keyframes goalflash{0%{box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(255,210,74,.6)}
                       100%{box-shadow:0 10px 26px rgba(0,0,0,.38)}}

  .kick{grid-area:kick;display:flex;flex-direction:column;justify-content:center;gap:1px;
        border-right:1px solid var(--line);padding-right:11px}
  .kt{font-size:15px;font-weight:900;letter-spacing:.2px}
  .ka{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:1px}
  .ks{font-size:9px;font-weight:900;color:var(--gold);letter-spacing:.6px;margin-top:3px}

  .teams{grid-area:teams;display:flex;flex-direction:column;justify-content:center;gap:7px;min-width:0}
  .trow{display:flex;align-items:center;gap:10px;min-width:0}
  .flag{font-size:21px;width:25px;text-align:center;flex:none;
        filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .tname{font-weight:700;font-size:16px;color:#cfd8e6;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;flex:1;min-width:0}
  .tname.win{color:#fff;font-weight:800}
  .tname.tbd{color:#5f6b80;font-style:italic;font-weight:600}
  .sc{font-variant-numeric:tabular-nums;font-weight:900;font-size:23px;min-width:24px;text-align:right;
      color:#fff;flex:none}
  .sc.dim{color:#3a445a;font-weight:800}
  .trow.win .sc{color:var(--gold)}

  .meta{grid-area:meta;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px}
  .badge{font-size:10px;font-weight:900;letter-spacing:.5px;padding:3px 10px;border-radius:999px;
         text-transform:uppercase;white-space:nowrap}
  .b-live{background:linear-gradient(135deg,#ff3b5c,#ff7a3b);color:#fff;animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,92,.55)}70%{box-shadow:0 0 0 11px rgba(255,59,92,0)}
                   100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}}
  .b-final{background:rgba(255,255,255,.1);color:#cdd6e6}
  .b-sched{background:rgba(124,92,255,.18);color:#bcaaff}
  .b-manual{background:linear-gradient(135deg,#ffd24a,#ff9d3b);color:#241a02}
  .edit{font-size:11px;color:var(--muted);background:none;border:none;padding:2px 4px;text-decoration:underline;font-weight:700}
  .editor{display:flex;align-items:center;gap:5px}
  .editor input{width:38px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
                color:#fff;border-radius:9px;padding:5px;text-align:center;font-size:16px;font-weight:800}

  .venue{grid-area:venue;font-size:11px;color:#6a7488;margin-top:9px;padding-top:9px;
         border-top:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .empty{color:var(--muted);text-align:center;padding:54px 20px;font-weight:600}

  /* USA / Germany flair */
  .flagbar{position:absolute;left:0;right:0;top:0;height:4px;background-size:200% 100%;animation:slide 3s linear infinite}
  .flagbar.de{top:4px}
  .flagbar.usa{background:linear-gradient(90deg,#b22234,#fff,#3c3b6e,#b22234,#fff,#3c3b6e)}
  .flagbar.germany{background:linear-gradient(90deg,#000,#dd0000,#ffce00,#000,#dd0000,#ffce00)}
  @keyframes slide{to{background-position:-200% 0}}
  .card.feat{padding-top:16px}.card.feat.feat2{padding-top:20px}
  .feat-usa{box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(60,59,110,.6)}
  .feat-germany{box-shadow:0 10px 26px rgba(0,0,0,.38),0 0 0 1px rgba(221,0,0,.55)}
  .flags{display:flex;gap:3px;margin-bottom:1px}
  .flagwave{display:inline-block;font-size:18px;line-height:1;transform-origin:bottom center;
            animation:wave 1.3s ease-in-out infinite}
  .flagwave.d2{animation-delay:.4s}
  @keyframes wave{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(12deg) translateY(-2px)}}

  /* confetti */
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
  .confetti-pc{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(108vh) rotate(720deg);opacity:1}}
  .goaltoast{position:fixed;left:50%;top:30%;transform:transl(-50%,-50%) scale(.6);z-index:60;
             font-size:40px;font-weight:900;letter-spacing:2px;pointer-events:none;opacity:0;
             background:linear-gradient(90deg,#19e08a,#ffd24a);-webkit-background-clip:text;background-clip:text;
             color:transparent;text-shadow:0 8px 30px rgba(0,0,0,.5)}
  .goaltoast.show{animation:toast 1.6s ease-out forwards}
  @keyframes toast{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
                   80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
                   100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
  a{color:var(--accent)}

  /* Polymarket title-odds panel */
  .oddshdr{display:flex;align-items:center;gap:10px;margin:6px 4px 4px;flex-wrap:wrap}
  .oddshdr h2{font-size:16px;margin:0;font-weight:900;letter-spacing:.2px}
  .oddshdr .by{font-size:11px;color:var(--muted);font-weight:700}
  .oddshdr .by a{font-weight:800;text-decoration:none}
  .oddssub{font-size:11px;color:var(--muted);margin:0 4px 14px;line-height:1.5}
  .oddrow{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:9px;
          border-radius:14px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
          border:1px solid var(--line);box-shadow:0 8px 20px rgba(0,0,0,.32)}
  .oddrow .fill{position:absolute;left:0;top:0;bottom:0;z-index:0;border-radius:14px;
          background:linear-gradient(90deg,rgba(25,224,138,.22),rgba(124,92,255,.14));
          transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .oddrow.top1 .fill{background:linear-gradient(90deg,rgba(255,210,74,.32),rgba(255,157,59,.16))}
  .oddrow>*{position:relative;z-index:1}
  .oddrk{font-size:12px;font-weight:900;color:var(--muted);width:18px;text-align:center;flex:none}
  .oddrow.top1 .oddrk{color:var(--gold)}
  .oddflag{font-size:23px;width:27px;text-align:center;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
  .oddteam{font-weight:800;font-size:16px;color:#e7edf6;flex:1;min-width:0;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis}
  .oddpct{font-variant-numeric:tabular-nums;font-weight:900;font-size:19px;color:#fff;flex:none}
  .oddrow.top1 .oddpct{color:var(--gold)}
  .oddmove{font-size:14px;cursor:pointer;color:var(--accent);text-decoration:underline;font-weight:800}
</style>
</head>

// ---- team name canonicalization ----
function canon(name){
  if(!name) return "";
  let s = name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  s = s.replace(/[^a-z0-9]/g,"");
  const alias = {
    turkey:"turkiye", trkiye:"turkiye", czechrepublic:"czechia",
    cotedivoire:"ivorycoast", drcongo:"congodr", democraticrepublicofthecongo:"congodr",
    congodemocraticrepublic:"congodr", korearepublic:"southkorea",
    usa:"unitedstates", unitedstatesofamerica:"unitedstates", us:"unitedstates",
    caboverde:"capeverde", bosniaherzegovina:"bosniaandherzegovina",
    irislamicrepublic:"iran", iranislamicrepublic:"iran",
  };
  return alias[s] || s;
}
function pairKey(a,b){ return [canon(a),canon(b)].sort().join("__"); }
function flag(team){ if(!team) return "🏳️"; return FLAGS[canon(team)] || "⚽"; }

const pairToId = {};
MATCHES.forEach(m=>{ if(m.home && m.away) pairToId[pairKey(m.home,m.away)] = m.id; });

// ---- date helpers ----
function ymd(iso){ return iso.replace(/-/g,""); }
function todayLocalYMD(){
  const d=new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
function ymdShift(s, delta){
  const d=new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)); d.setDate(d.getDate()+delta);
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
const ALL_DATES = [...new Set(MATCHES.map(m=>ymd(m.date)))].sort();

// ---- ESPN fetch + merge ----
async function fetchScoreboard(dateYMD){
  const path = `https://site.api.espn.com/apis/site/v2/sports/soccer/${LEAGUE}/scoreboard?dates=${dateYMD}`;
  try{
    const r = await fetch(path, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  }catch(e){
    const r2 = await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(path), {cache:"no-store"});
    if(!r2.ok) throw new Error("proxy HTTP "+r2.status);
    return await r2.json();
  }
}
let goalIds = [];
function ingest(data){
  let seen=0, matched=0;
  (data.events||[]).forEach(ev=>{
    seen++;
    const comp = (ev.competitions||[])[0]; if(!comp) return;
    const cs = comp.competitors||[]; if(cs.length<2) return;
    const A=cs[0], B=cs[1];
    const nameA=(A.team&&(A.team.displayName||A.team.name))||A.displayName;
    const nameB=(B.team&&(B.team.displayName||B.team.name))||B.displayName;
    const id = pairToId[pairKey(nameA,nameB)]; if(!id) return;
    const m = MATCHES.find(x=>x.id===id);
    const map={}; map[canon(nameA)]=A.score; map[canon(nameB)]=B.score;
    const sh=map[canon(m.home)], sa=map[canon(m.away)];
    const st=(ev.status&&ev.status.type)||{};
    const state = st.state||"pre";
    const started = state==="in" || state==="post";
    const prev = store[id];
    if(prev && prev.src==="manual") return;
    const nh = started && sh!==undefined ? Number(sh) : null;
    const na = started && sa!==undefined ? Number(sa) : null;
    // detect a new goal vs what we had before (for confetti)
    if(prev && prev.h!=null && nh!=null && (nh>prev.h || na>prev.a)) goalIds.push(id);
    store[id] = { h:nh, a:na, status: state==="in"?"live":(state==="post"?"final":"sched"),
                  det: st.shortDetail||st.detail||"", src:"api" };
    matched++;
  });
  return {seen, matched};
}

async function refresh(dates){
  const btn=document.getElementById("refresh"), sync=document.getElementById("syncall");
  btn.disabled=true; sync.disabled=true; setStatus("Fetching latest scores…");
  goalIds=[];
  let matched=0, seen=0, errors=0;
  await Promise.all(dates.map(d=>
    fetchScoreboard(d).then(j=>{ const r=ingest(j); matched+=r.matched; seen+=r.seen; })
                      .catch(()=>{ errors++; })));
  save(); render();
  if(goalIds.length) celebrateGoals(goalIds);
  const t=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  setStatus(errors===dates.length
    ? `⚠️ Couldn't reach the scores feed (all ${errors} requests failed). Showing saved scores — tap Edit to enter scores by hand. ${t}`
    : `Updated ${matched} score(s) · ${seen} games seen in feed · ${dates.length} day(s) checked${errors?` · ${errors} failed`:""} · ${t} · ${APP_VERSION}`);
  btn.disabled=false; sync.disabled=false;
}
function recentDates(){

function parseNum(v){ if(typeof v==="number") return v; if(typeof v!=="string") return null;
  const n=Number(v); return isFinite(n)?n:null; }
function parseArr(v){ if(Array.isArray(v)) return v; if(typeof v==="string"){ try{return JSON.parse(v);}catch(e){} } return null; }

function parseOdds(data){

  const markets = (ev && ev.markets) || [];

    if(mk.closed) return;
    const team = mk.groupItemTitle || mk.question || mk.title;
    if(!team) return;
    // "Yes" price = implied probability the team wins
    let p = null;
    const prices = parseArr(mk.outcomePrices);
    const names  = parseArr(mk.outcomes);
    if(prices && names){ const yi=names.findIndex(n=>/yes/i.test(n)); p = parseNum(prices[yi>=0?yi:0]); }
    if(p==null) p = parseNum(mk.lastTradePrice);
    if(p==null && mk.bestBid!=null && mk.bestAsk!=null) p=(parseNum(mk.bestBid)+parseNum(mk.bestAsk))/2;

    out.push({team: team.trim(), prob: p});

  if(oddsLoading) return;
  if(!force && odds && Date.now()-oddsTs < 5*60*1000) return;   // fresh enough
  oddsLoading=true; if(activeFilter===ODDS_TAB) render();
  try{
    const list = parseOdds(await fetchOddsJSON());
    if(list.length){ odds=list; oddsTs=Date.now();
      localStorage.setItem(LS_ODDS, JSON.stringify({list:odds, ts:oddsTs})); }
  }catch(e){ /* keep any cached odds; renderOdds shows a notice */ }
  oddsLoading=false; if(activeFilter===ODDS_TAB) render();
}
function agoLabel(ms){ if(!ms) return ""; const s=Math.round((Date.now()-ms)/1000);
  if(s<60) return "just now"; const m=Math.round(s/60); if(m<60) return m+"m ago";
  return Math.round(m/60)+"h ago"; }
function renderOdds(){
  const link=`https://polymarket.com/event/${POLY_SLUG}`;
  let head=`<div class="oddshdr"><h2>🏆 Who wins it all?</h2>
    <span class="by">live bettor odds · <a href="${link}" target="_blank" rel="noopener">Polymarket ↗</a></span></div>
    <p class="oddssub">Implied chance each nation lifts the trophy, from real-money prediction markets${oddsTs?` · updated ${agoLabel(oddsTs)}`:""}. <span class="oddmove" id="oddrefresh">↻ refresh</span></p>`;
  if(oddsLoading && !odds) return head+`<div class="empty">Loading market odds…</div>`;
  if(!odds || !odds.length) return head+`<div class="empty">Couldn't reach Polymarket right now. Tap ↻ refresh to retry, or open the <a href="${link}" target="_blank" rel="noopener">market ↗</a>.</div>`;
  const max=odds[0].prob||1;
  const rows=odds.slice(0,16).map((o,i)=>{
    const pct=o.prob*100, w=Math.max(4,(o.prob/max)*100);
    const show=pct>=1?Math.round(pct):pct.toFixed(1);
    return `<div class="oddrow ${i===0?"top1":""}"><div class="fill" style="width:${w}%"></div>
      <span class="oddrk">${i+1}</span><span class="oddflag">${flag(o.team)}</span>
      <span class="oddteam">${o.team}</span><span class="oddpct">${show}%</span></div>`;
  }).join("");
  return head+rows;
}

// ---- rendering ----
let activeFilter = localStorage.getItem(LS_FILTER) || "Today";
const STAGES=["Group Stage","Round of 32","Round of 16","Quarterfinals","Semifinals","Third-Place Match","Final"];
const STAGE_SHORT={"Group Stage":"","Round of 32":"R32","Round of 16":"R16","Quarterfinals":"QF","Semifinals":"SF","Third-Place Match":"3RD","Final":"FINAL"};
const FEATURED=[
  {team:"United States", flag:"🇺🇸", cls:"usa",     label:"🇺🇸 USA"},
  {team:"Germany",       flag:"🇩🇪", cls:"germany", label:"🇩🇪 Germany"},
];
const ODDS_TAB="📊 Title odds";
const FILTERS=["Today","Live","All",ODDS_TAB,...FEATURED.map(f=>f.label),...STAGES];
function involves(m, team){ const c=canon(team); return canon(m.home||"")===c || canon(m.away||"")===c; }
function featsFor(m){ return FEATURED.filter(f=>involves(m,f.team)); }

function setStatus(t){ document.getElementById("updated").innerHTML=t; }
function dayLabel(iso){ const [y,mo,da]=iso.split("-").map(Number);
  return new Date(y,mo-1,da).toLocaleDateString([], {weekday:"long",month:"long",day:"numeric"}); }
function isToday(iso){ return ymd(iso)===todayLocalYMD(); }

function matchRow(m){
  const sc = store[m.id] || {};
  const live = sc.status==="live";
  const hasScore = sc.h!=null && sc.a!=null;
  const homeWin = hasScore && sc.h>sc.a, awayWin = hasScore && sc.a>sc.h;
  const tbd = !(m.home&&m.away);
  const [kt, ka] = m.time.split(" ");
  const ks = STAGE_SHORT[m.stage]||"";

  let badge;
  if(sc.src==="manual") badge=`<span class="badge b-manual">edited</span>`;
  else if(live) badge=`<span class="badge b-live">● LIVE${sc.det?(" "+sc.det):""}</span>`;
  else if(sc.status==="final") badge=`<span class="badge b-final">Full time</span>`;
  else badge=`<span class="badge b-sched">${kt} ${ka||""}</span>`;

  const scH = hasScore? sc.h : "–", scA = hasScore? sc.a : "–";
  const dimH = hasScore?"":" dim", dimA = hasScore?"":" dim";

  const feats = featsFor(m);
  let featCls="", flagbars="", waves="";
  if(feats.length){
    featCls = " feat " + (feats.length>1?"feat2 ":"") + feats.map(f=>"feat-"+f.cls).join(" ");
    flagbars = feats.map(f=>`<div class="flagbar ${f.cls}"></div>`).join("");
    waves = `<div class="flags">`+feats.map((f,i)=>`<span class="flagwave ${i?"d2":""}">${f.flag}</span>`).join("")+`</div>`;
  }

  return `<div class="card ${live?"live":""}${featCls}" data-id="${m.id}">
    ${flagbars}
    <div class="kick"><span class="kt">${kt}</span><span class="ka">${ka||""}</span>${ks?`<span class="ks">${ks}</span>`:""}</div>
    <div class="teams">
      <div class="trow ${homeWin?"win":""}"><span class="flag">${flag(m.home)}</span><span class="tname ${homeWin?"win":""} ${tbd?"tbd":""}">${m.home||"TBD"}</span><span class="sc${dimH}">${scH}</span></div>
      <div class="trow ${awayWin?"win":""}"><span class="flag">${flag(m.away)}</span><span class="tname ${awayWin?"win":""} ${tbd?"tbd":""}">${m.away||"TBD"}</span><span class="sc${dimA}">${scA}</span></div>
    </div>
    <div class="meta">${waves}${badge}<button class="edit" data-edit="${m.id}">Edit</button></div>
    <div class="venue">${m.venue}</div>
  </div>`;
}

function render(){
  const fc=document.getElementById("filters");
  fc.innerHTML=FILTERS.map(f=>`<button class="${f===activeFilter?"on":""}" data-f="${f}">${f}</button>`).join("");

  if(activeFilter===ODDS_TAB){
    document.getElementById("list").innerHTML=renderOdds();
    loadOdds(false);
    return;
  }

  let list = MATCHES.slice();
  const featTab = FEATURED.find(f=>f.label===activeFilter);
  if(activeFilter==="Today") list=list.filter(m=>isToday(m.date));
  else if(activeFilter==="Live") list=list.filter(m=>(store[m.id]||{}).status==="live");
  else if(featTab) list=list.filter(m=>involves(m,featTab.team));
  else if(STAGES.includes(activeFilter)) list=list.filter(m=>m.stage===activeFilter);

  const host=document.getElementById("list");
  if(!list.length){
    host.innerHTML=`<div class="empty">${activeFilter==="Today"?"No matches scheduled for today.":
      activeFilter==="Live"?"No matches are live right now.":
      featTab?`No ${featTab.team} matches found.`:"No matches."}</div>`;
    return;
  }
  const byDate={}; list.forEach(m=>{ (byDate[m.date]=byDate[m.date]||[]).push(m); });
  host.innerHTML=Object.keys(byDate).sort().map(d=>
    `<div class="daygroup"><div class="dayhdr">${dayLabel(d)}${isToday(d)?` <span class="pill-today">TODAY</span>`:""}</div>${byDate[d].map(matchRow).join("")}</div>`
  ).join("");
}

// ---- editing ----
function openEditor(id){
  const sc=store[id]||{};
  const row=document.querySelector(`.card[data-id="${id}"] .meta`); if(!row) return;
  row.innerHTML=`<div class="editor"><input id="eh" type="number" min="0" value="${sc.h!=null?sc.h:""}"><span>:</span><input id="ea" type="number" min="0" value="${sc.a!=null?sc.a:""}"></div>
    <div><button data-save="${id}" class="edit">Save</button> <button data-clear="${id}" class="edit">Clear</button></div>`;
}
document.addEventListener("click",(e)=>{
  if(e.target.closest("#oddrefresh")){ loadOdds(true); return; }
  const f=e.target.closest("[data-f]");
  if(f){ activeFilter=f.dataset.f; localStorage.setItem(LS_FILTER,activeFilter); render(); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ openEditor(Number(ed.dataset.edit)); return; }
  const sv=e.target.closest("[data-save]");
  if(sv){ const id=Number(sv.dataset.save);
    const h=document.getElementById("eh").value, a=document.getElementById("ea").value;
    store[id]={ h:h===""?null:Number(h), a:a===""?null:Number(a),
                status:(h!==""&&a!=="")?"final":"sched", det:"", src:"manual" };
    save(); render(); return; }
  const cl=e.target.closest("[data-clear]");
  if(cl){ delete store[Number(cl.dataset.clear)]; save(); render(); return; }
});

// ---- celebrations ----
function confettiBurst(colors){
  const host=document.getElementById("confetti");
  for(let i=0;i<90;i++){
    const p=document.createElement("div"); p.className="confetti-pc";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(2.2+Math.random()*1.6)+"s";
    p.style.animationDelay=(Math.random()*.3)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    host.appendChild(p); setTimeout(()=>p.remove(),4200);
  }
}
function celebrateGoals(ids){
  // color the confetti for USA/Germany goals, else festive default
  let colors=["#19e08a","#ffd24a","#7c5cff","#ff3b5c","#fff"];
  const m=MATCHES.find(x=>x.id===ids[0]);
  if(m){ if(involves(m,"United States")) colors=["#b22234","#fff","#3c3b6e"];
         else if(involves(m,"Germany"))  colors=["#000","#dd0000","#ffce00"]; }
  const t=document.getElementById("goaltoast"); t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  confettiBurst(colors);
  ids.forEach(id=>{ const el=document.querySelector(`.card[data-id="${id}"]`);
    if(el){ el.classList.remove("goal"); void el.offsetWidth; el.classList.add("goal"); } });
}

// ---- buttons / easter eggs ----
document.getElementById("refresh").addEventListener("click",()=>refresh(recentDates()));
document.getElementById("syncall").addEventListener("click",()=>{
  const today=todayLocalYMD();
  refresh([...ALL_DATES.filter(d=>d<=today), ymdShift(today,1)]);
});
let timer=null;
document.getElementById("auto").addEventListener("change",(e)=>{
  if(e.target.checked){ timer=setInterval(()=>refresh(recentDates()),60000); refresh(recentDates()); }
  else if(timer){ clearInterval(timer); timer=null; }
});
let taps=0, tapt=0;
document.getElementById("logo").addEventListener("click",()=>{
  const now=Date.now(); taps = now-tapt<800 ? taps+1 : 1; tapt=now;
  const l=document.getElementById("logo"); l.classList.remove("spin"); void l.offsetWidth; l.classList.add("spin");
  if(taps>=3){ taps=0; confettiBurst(["#19e08a","#ffd24a","#7c5cff","#ff3b5c","#fff"]);
    const t=document.getElementById("goaltoast"); t.textContent="Forrest the Hat Trick Champion"; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
    setTimeout(()=>{t.textContent="GOAL!";},1700); }
});

document.getElementById("ver").textContent = APP_VERSION;
render();
</script>
</body>
